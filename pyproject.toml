[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xenodream-xxp"
version = "0.1.0"
description = "Evidence-based lossless tools for XenoDream X parameter files"
requires-python = ">=3.11"

[project.scripts]
xxp = "xenodream_xxp.cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
