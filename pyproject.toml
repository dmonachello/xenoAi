[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xenodream-xxp"
version = "0.1.0"
description = "Evidence-based lossless tools for XenoDream X parameter files"
requires-python = ">=3.11"

[project.scripts]
xxp = "xenodream_xxp.cli:main"

[project.optional-dependencies]
automation = ["pywinauto==0.6.9"]
build = ["pyinstaller==6.22.3"]
fabrication = [
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-image==0.26.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xenodream_xxp = ["templates/**/*.xxp"]
